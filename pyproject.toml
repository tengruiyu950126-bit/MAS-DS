[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-ds"
version = "0.1.0"
description = "Policy-constrained hybrid data-cleaning system"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<4",
    "pydantic>=2.8,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]
evaluation = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
mas-ds-chunked = "scripts.run_chunked_preprocessing:main"
mas-ds-evaluate = "evaluation.run_experiment:main"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "evaluation*",
    "models*",
    "providers*",
    "scripts*",
    "tools*",
]
exclude = ["data*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
