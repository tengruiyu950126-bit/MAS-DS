[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-ds"
version = "0.1.0"
description = "Adaptive multi-agent data preprocessing system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "langgraph>=0.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
evaluation = ["scikit-learn>=1.5"]

[tool.setuptools.packages.find]
include = [
    "agents*",
    "evaluation*",
    "models*",
    "providers*",
    "scripts*",
    "tools*",
    "workflow*",
]
exclude = ["data*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
